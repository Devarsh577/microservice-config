spring:
  application:
    name: quiz-service

server:
  port: 9091

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    refresh:
      enable: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"